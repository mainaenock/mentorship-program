<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Goal Achievement Platform architecture</title>
  <desc id="desc">A compact map showing the user journey, route layers, role portals, shared kernel, demo adapters, and future server boundary.</desc>
  <defs>
    <style>
      .bg{fill:#f7f7f2}.ink{fill:#1f2933}.muted{fill:#66737f}.box{fill:#fff;stroke:#b8c3cc;stroke-width:2}.blue{fill:#e4f0ff;stroke:#5b8def}.green{fill:#e5f6ee;stroke:#4d9c72}.gold{fill:#fff1cc;stroke:#c58a25}.purple{fill:#f0e9ff;stroke:#8663c7}.red{fill:#ffe5e1;stroke:#c66b5d}.line{stroke:#657582;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#8997a3;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow)}text{font-family:Arial,sans-serif}.head{font-size:26px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:16px}.tiny{font-size:14px}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#657582"/></marker>
  </defs>
  <rect class="bg" width="1600" height="980"/>
  <text x="60" y="55" class="head ink">Goal Achievement Platform · architecture map</text>
  <text x="60" y="84" class="small muted">Current frontend demo architecture — arrows show the main flow and dependency direction.</text>

  <text x="60" y="130" class="label ink">1 · User journey</text>
  <g transform="translate(60 150)">
    <rect class="blue" x="0" y="0" width="125" height="54" rx="12"/><text x="62" y="33" text-anchor="middle" class="small ink">Visitor</text>
    <rect class="blue" x="155" y="0" width="145" height="54" rx="12"/><text x="227" y="33" text-anchor="middle" class="small ink">Register / login</text>
    <rect class="blue" x="330" y="0" width="130" height="54" rx="12"/><text x="395" y="33" text-anchor="middle" class="small ink">Verify</text>
    <rect class="green" x="490" y="0" width="130" height="54" rx="12"/><text x="555" y="33" text-anchor="middle" class="small ink">Onboarding</text>
    <rect class="green" x="650" y="0" width="125" height="54" rx="12"/><text x="712" y="33" text-anchor="middle" class="small ink">Goal</text>
    <rect class="green" x="805" y="0" width="125" height="54" rx="12"/><text x="867" y="33" text-anchor="middle" class="small ink">Action</text>
    <rect class="green" x="960" y="0" width="125" height="54" rx="12"/><text x="1022" y="33" text-anchor="middle" class="small ink">Evidence</text>
    <rect class="purple" x="1115" y="0" width="145" height="54" rx="12"/><text x="1187" y="33" text-anchor="middle" class="small ink">Learn + mentor</text>
    <rect class="gold" x="1290" y="0" width="145" height="54" rx="12"/><text x="1362" y="33" text-anchor="middle" class="small ink">Evaluate → next</text>
    <path class="line" d="M125 27H155 M300 27H330 M460 27H490 M620 27H650 M775 27H805 M930 27H960 M1085 27H1115 M1260 27H1290"/>
    <rect class="red" x="490" y="82" width="275" height="48" rx="12"/><text x="627" y="112" text-anchor="middle" class="small ink">Minor path: guardian consent</text>
    <path class="dash" d="M555 54V82"/>
  </g>

  <text x="60" y="310" class="label ink">2 · Runtime layers</text>
  <g transform="translate(60 330)">
    <rect class="box" x="0" y="0" width="240" height="78" rx="14"/><text x="120" y="32" text-anchor="middle" class="label ink">Browser</text><text x="120" y="56" text-anchor="middle" class="tiny muted">request starts here</text>
    <rect class="blue" x="335" y="0" width="300" height="78" rx="14"/><text x="485" y="30" text-anchor="middle" class="label ink">Next app entry</text><text x="485" y="56" text-anchor="middle" class="tiny ink">layout · public routes · member routes</text>
    <rect class="green" x="670" y="0" width="300" height="78" rx="14"/><text x="820" y="30" text-anchor="middle" class="label ink">PortalShell</text><text x="820" y="56" text-anchor="middle" class="tiny ink">session gate · navigation · role home</text>
    <rect class="purple" x="1005" y="0" width="270" height="78" rx="14"/><text x="1140" y="30" text-anchor="middle" class="label ink">Route + permission</text><text x="1140" y="56" text-anchor="middle" class="tiny ink">match · visible · scope</text>
    <rect class="gold" x="1310" y="0" width="230" height="78" rx="14"/><text x="1425" y="30" text-anchor="middle" class="label ink">Domain screen</text><text x="1425" y="56" text-anchor="middle" class="tiny ink">goals · learning · etc.</text>
    <path class="line" d="M240 39H335 M635 39H670 M970 39H1005 M1275 39H1310"/>
  </g>

  <text x="60" y="480" class="label ink">3 · Role portals and shared kernel</text>
  <g transform="translate(60 500)">
    <rect class="blue" x="0" y="0" width="250" height="115" rx="14"/><text x="125" y="32" text-anchor="middle" class="label ink">Member</text><text x="125" y="61" text-anchor="middle" class="small ink">goals · learning · payments</text><text x="125" y="86" text-anchor="middle" class="small ink">mentor · account</text>
    <rect class="blue" x="280" y="0" width="250" height="115" rx="14"/><text x="405" y="32" text-anchor="middle" class="label ink">Mentor</text><text x="405" y="61" text-anchor="middle" class="small ink">mentees · sessions</text><text x="405" y="86" text-anchor="middle" class="small ink">notes · evaluations</text>
    <rect class="blue" x="560" y="0" width="250" height="115" rx="14"/><text x="685" y="32" text-anchor="middle" class="label ink">Guardian</text><text x="685" y="61" text-anchor="middle" class="small ink">children · consents</text><text x="685" y="86" text-anchor="middle" class="small ink">safety · oversight</text>
    <rect class="blue" x="840" y="0" width="250" height="115" rx="14"/><text x="965" y="32" text-anchor="middle" class="label ink">Administration</text><text x="965" y="61" text-anchor="middle" class="small ink">users · content · finance</text><text x="965" y="86" text-anchor="middle" class="small ink">compliance · analytics</text>
    <rect class="green" x="1140" y="0" width="400" height="115" rx="14"/><text x="1340" y="32" text-anchor="middle" class="label ink">Shared kernel</text><text x="1340" y="61" text-anchor="middle" class="small ink">config · typed contracts · UI</text><text x="1340" y="86" text-anchor="middle" class="small ink">session · demo services</text>
    <path class="line" d="M250 57H280 M530 57H560 M810 57H840 M1090 57H1140"/>
  </g>

  <text x="60" y="680" class="label ink">4 · Data boundary</text>
  <g transform="translate(60 700)">
    <rect class="gold" x="0" y="0" width="470" height="125" rx="14"/><text x="235" y="34" text-anchor="middle" class="label ink">Current: demo adapters</text><text x="235" y="64" text-anchor="middle" class="small ink">sessionStorage · localStorage · memory</text><text x="235" y="91" text-anchor="middle" class="tiny muted">safe for demonstrations; not production authority</text>
    <rect class="purple" x="610" y="0" width="470" height="125" rx="14"/><text x="845" y="34" text-anchor="middle" class="label ink">Future: server boundary</text><text x="845" y="64" text-anchor="middle" class="small ink">validated API · database · private files</text><text x="845" y="91" text-anchor="middle" class="tiny muted">same typed interfaces, authoritative permissions</text>
    <rect class="red" x="1160" y="0" width="380" height="125" rx="14"/><text x="1350" y="34" text-anchor="middle" class="label ink">Non-negotiable gates</text><text x="1350" y="64" text-anchor="middle" class="small ink">ownership · role · consent</text><text x="1350" y="91" text-anchor="middle" class="small ink">versioning · audit · privacy</text>
    <path class="dash" d="M470 62H610"/>
    <path class="line" d="M1080 62H1160"/>
  </g>

  <text x="60" y="900" class="tiny muted">Main files: app/layout.tsx · app/[...slug]/page.tsx · app/app/[[...path]]/page.tsx · domains/portal · domains/shared · docs/API_CONTRACT.md</text>
</svg>
