<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">How to use the Goal Achievement Platform</title>
  <desc id="desc">A beginner-friendly visual guide showing first visit, returning visits, goals, learning, credits, and mentorship.</desc>
  <defs>
    <style>
      .bg{fill:#fffaf2}.ink{fill:#25313b}.muted{fill:#66737f}.box{fill:#fff;stroke:#c8d0d6;stroke-width:2}.blue{fill:#e3efff;stroke:#6192d9;stroke-width:2}.green{fill:#e4f7ec;stroke:#5aa477;stroke-width:2}.gold{fill:#fff0c9;stroke:#c08b2c;stroke-width:2}.purple{fill:#eee7ff;stroke:#8468be;stroke-width:2}.pink{fill:#ffe8e6;stroke:#cb776e;stroke-width:2}.head{font:700 32px Arial,sans-serif}.section{font:700 23px Arial,sans-serif}.label{font:700 19px Arial,sans-serif}.body{font:17px Arial,sans-serif}.small{font:15px Arial,sans-serif}.line{stroke:#687782;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#8997a3;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="3" orient="auto"><path d="M0,0 L11,3 L0,6 Z" fill="#687782"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1120"/>
  <text x="60" y="58" class="head ink">How to use the platform</text>
  <text x="60" y="90" class="body muted">Choose a goal. Take small steps. Check your progress.</text>

  <text x="60" y="140" class="section ink">1 · Your first visit</text>
  <g transform="translate(60 165)">
    <rect class="blue" x="0" y="0" width="170" height="70" rx="14"/><text x="85" y="43" text-anchor="middle" class="label ink">Register</text>
    <rect class="blue" x="220" y="0" width="170" height="70" rx="14"/><text x="305" y="43" text-anchor="middle" class="label ink">Verify</text>
    <rect class="green" x="440" y="0" width="190" height="70" rx="14"/><text x="535" y="43" text-anchor="middle" class="label ink">Set up profile</text>
    <rect class="pink" x="680" y="0" width="220" height="70" rx="14"/><text x="790" y="32" text-anchor="middle" class="label ink">Guardian consent</text><text x="790" y="54" text-anchor="middle" class="small ink">if needed</text>
    <rect class="green" x="950" y="0" width="190" height="70" rx="14"/><text x="1045" y="43" text-anchor="middle" class="label ink">Create goal</text>
    <rect class="gold" x="1190" y="0" width="250" height="70" rx="14"/><text x="1315" y="32" text-anchor="middle" class="label ink">Choose small</text><text x="1315" y="54" text-anchor="middle" class="small ink">actions</text>
    <path class="line" d="M170 35H220 M390 35H440 M630 35H680 M900 35H950 M1140 35H1190"/>
  </g>

  <text x="60" y="310" class="section ink">2 · Every time you come back</text>
  <g transform="translate(60 335)">
    <rect class="green" x="0" y="0" width="190" height="70" rx="14"/><text x="95" y="43" text-anchor="middle" class="label ink">Home</text>
    <rect class="blue" x="250" y="0" width="190" height="70" rx="14"/><text x="345" y="43" text-anchor="middle" class="label ink">Goals</text>
    <rect class="purple" x="500" y="0" width="190" height="70" rx="14"/><text x="595" y="43" text-anchor="middle" class="label ink">Learn</text>
    <rect class="pink" x="750" y="0" width="190" height="70" rx="14"/><text x="845" y="43" text-anchor="middle" class="label ink">Mentor</text>
    <rect class="gold" x="1000" y="0" width="190" height="70" rx="14"/><text x="1095" y="43" text-anchor="middle" class="label ink">Profile</text>
    <rect class="box" x="1250" y="0" width="250" height="70" rx="14"/><text x="1375" y="30" text-anchor="middle" class="label ink">Notifications · Help</text><text x="1375" y="53" text-anchor="middle" class="small muted">Account · More</text>
    <path class="line" d="M190 35H250 M440 35H500 M690 35H750 M940 35H1000 M1190 35H1250"/>
  </g>
  <text x="60" y="435" class="body muted">Start at Home, then choose the button that matches what you want to do.</text>

  <text x="60" y="495" class="section ink">3 · Find your progress</text>
  <g transform="translate(60 520)">
    <rect class="blue" x="0" y="0" width="230" height="85" rx="14"/><text x="115" y="35" text-anchor="middle" class="label ink">Goals</text><text x="115" y="61" text-anchor="middle" class="small ink">Choose View Goal</text>
    <rect class="green" x="300" y="0" width="230" height="85" rx="14"/><text x="415" y="35" text-anchor="middle" class="label ink">Overview</text><text x="415" y="61" text-anchor="middle" class="small ink">See your progress %</text>
    <rect class="green" x="600" y="0" width="230" height="85" rx="14"/><text x="715" y="35" text-anchor="middle" class="label ink">Actions</text><text x="715" y="61" text-anchor="middle" class="small ink">Do the next step</text>
    <rect class="gold" x="900" y="0" width="230" height="85" rx="14"/><text x="1015" y="35" text-anchor="middle" class="label ink">Evidence</text><text x="1015" y="61" text-anchor="middle" class="small ink">Show what you did</text>
    <rect class="purple" x="1200" y="0" width="300" height="85" rx="14"/><text x="1350" y="35" text-anchor="middle" class="label ink">Evaluation</text><text x="1350" y="61" text-anchor="middle" class="small ink">Think, learn, adjust</text>
    <path class="line" d="M230 42H300 M530 42H600 M830 42H900 M1130 42H1200"/>
  </g>

  <text x="60" y="680" class="section ink">4 · Learn and use credits</text>
  <g transform="translate(60 705)">
    <rect class="purple" x="0" y="0" width="260" height="85" rx="14"/><text x="130" y="35" text-anchor="middle" class="label ink">Learn</text><text x="130" y="61" text-anchor="middle" class="small ink">Pick a lesson</text>
    <rect class="purple" x="330" y="0" width="260" height="85" rx="14"/><text x="460" y="35" text-anchor="middle" class="label ink">View Learning</text><text x="460" y="61" text-anchor="middle" class="small ink">Read, watch, listen</text>
    <rect class="gold" x="660" y="0" width="260" height="85" rx="14"/><text x="790" y="35" text-anchor="middle" class="label ink">Credits</text><text x="790" y="61" text-anchor="middle" class="small ink">Check your balance</text>
    <rect class="green" x="990" y="0" width="260" height="85" rx="14"/><text x="1120" y="35" text-anchor="middle" class="label ink">Mark Complete</text><text x="1120" y="61" text-anchor="middle" class="small ink">Save your learning</text>
    <rect class="box" x="1320" y="0" width="180" height="85" rx="14"/><text x="1410" y="35" text-anchor="middle" class="label ink">My Learning</text><text x="1410" y="61" text-anchor="middle" class="small ink">See your history</text>
    <path class="line" d="M260 42H330 M590 42H660 M920 42H990 M1250 42H1320"/>
  </g>
  <text x="60" y="820" class="body muted">Some lessons are free. Others may ask you to use credits before you start.</text>

  <text x="60" y="875" class="section ink">5 · A good weekly habit</text>
  <g transform="translate(60 900)">
    <rect class="box" x="0" y="0" width="220" height="70" rx="14"/><text x="110" y="43" text-anchor="middle" class="label ink">Open Home</text>
    <rect class="box" x="300" y="0" width="220" height="70" rx="14"/><text x="410" y="43" text-anchor="middle" class="label ink">Do one action</text>
    <rect class="box" x="600" y="0" width="220" height="70" rx="14"/><text x="710" y="43" text-anchor="middle" class="label ink">Mark it complete</text>
    <rect class="box" x="900" y="0" width="220" height="70" rx="14"/><text x="1010" y="43" text-anchor="middle" class="label ink">Check progress</text>
    <rect class="box" x="1200" y="0" width="300" height="70" rx="14"/><text x="1350" y="43" text-anchor="middle" class="label ink">Choose the next step</text>
    <path class="line" d="M220 35H300 M520 35H600 M820 35H900 M1120 35H1200"/>
  </g>
  <text x="60" y="1030" class="body ink">Stuck? Choose Help. Need a reminder? Choose Notifications. Finished? Choose Account → Log out.</text>
</svg>
